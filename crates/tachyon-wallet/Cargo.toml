[package]
name = "tachyon-wallet"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
bs58 = { version = "0.5", features = ["check"] }
clap = { version = "4.5", features = ["derive"] }
ff = "0.14"
hex = "0.4"
pasta_curves = { package = "zakura-pasta-curves", version = "1.0.1" }
rand = { version = "0.10", features = ["std_rng"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = "0.37"
secp256k1 = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ripemd = "0.1"
zcash_script = "0.4.3"
ragu = { git = "https://github.com/tachyon-zcash/ragu", rev = "0881656dc3d9f47d3d9eaaf692b15dd8938d9bf9", features = ["mock"] }
ragu_circuits = { git = "https://github.com/tachyon-zcash/ragu", rev = "0881656dc3d9f47d3d9eaaf692b15dd8938d9bf9" }
zcash_tachyon = { git = "https://github.com/tachyon-zcash/tachyon", rev = "a4abfbddb7dd4ac1db67df7cc19d57d0d965d3e7" }
primitives = { package = "zakura-primitives", git = "https://github.com/zakura-core/common.git", rev = "a9081dc0c3df782bd2badb829f9ebff51d01a9a7", default-features = false, features = ["std"] }
protocol = { package = "zakura-protocol", git = "https://github.com/zakura-core/common.git", rev = "a9081dc0c3df782bd2badb829f9ebff51d01a9a7" }
transparent = { package = "zakura-transparent", git = "https://github.com/zakura-core/common.git", rev = "a9081dc0c3df782bd2badb829f9ebff51d01a9a7" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("nutachyon"))'] }
